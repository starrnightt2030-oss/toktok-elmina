name: Android app check
# Installs the published APK on an Android emulator, opens it and records what the screen shows (screenshots + log),
# so the app can be checked without a phone.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk-latest -R ${{ github.repository }} -p toktok-elmina.apk -D .
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p out
            adb install -r toktok-elmina.apk
            adb logcat -c
            adb shell monkey -p io.github.starrnightt.toktokelmina -c android.intent.category.LAUNCHER 1
            sleep 15; adb exec-out screencap -p > out/s15.png
            sleep 30; adb exec-out screencap -p > out/s45.png
            sleep 45; adb exec-out screencap -p > out/s90.png
            adb shell input tap 540 1200; sleep 20; adb exec-out screencap -p > out/s110_tap.png
            adb logcat -d > out/logcat.txt || true
            adb logcat -d -s chromium:* Capacitor:* Capacitor/Console:* AndroidRuntime:* > out/webview.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check
          path: out/
