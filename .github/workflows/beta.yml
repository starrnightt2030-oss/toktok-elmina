# Beta channel: publishes this branch at /toktok-elmina/beta/ and republishes the main game
# byte for byte as it is live right now (downloaded from the live site, never rebuilt),
# so pushing to `beta` can never change what players see on the main link.
name: Deploy Beta
on:
  push:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIVE: https://starrnightt2030-oss.github.io/toktok-elmina/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Save tests
        run: node tools/save_test.mjs
      - name: Build Beta
        run: npm run build:beta
      - name: Main game file list (from the main branch, not deployed)
        run: |
          git fetch --depth=1 origin main
          git worktree add main-src origin/main
          cd main-src && npm ci --silent && npm run build --silent
      - name: Copy the live main game exactly as it is
        run: |
          set -e
          mkdir -p site
          curl -fsS "$LIVE" -o site/index.html
          # every file the live page references (hashed bundle etc.)
          grep -oE '\./assets/[^"'"'"' )]+' site/index.html | sort -u > refs.txt
          # every static file of the main build (models, images, icons, sw, manifest, version)
          (cd main-src/dist && find . -type f ! -path './assets/*' ! -name index.html | sed 's#^\./##') >> refs.txt
          while read -r f; do
            f="${f#./}"; mkdir -p "site/$(dirname "$f")"
            curl -fsS "$LIVE$f" -o "site/$f" || { echo "missing on live site: $f"; exit 1; }
          done < refs.txt
          echo "main files copied: $(wc -l < refs.txt)"
          cat site/version.json
      - name: Add Beta under /beta/
        run: |
          cp -r dist-beta site/beta
          cat site/beta/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}beta/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
