name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # after a new Android app is built, publish it next to the game (same site, plain download link)
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Android app next to the game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk-latest -R ${{ github.repository }} -p toktok-elmina.apk -D dist || echo "no APK yet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
